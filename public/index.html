<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>どろぼうマルチ</title>
<style>
html,body{margin:0;height:100%;background:#0d1117;color:#eee;font:14px/1.5 sans-serif;overflow:hidden}
#cv{display:block;margin:0 auto;width:min(100vw,175vh);height:auto;background:#34503a}
.box{position:fixed;background:#000b;border-radius:8px;padding:8px 12px}
#hud{top:8px;left:8px}
#shop{top:8px;right:8px;flex-direction:column;gap:6px;width:190px}
#lobby{inset:0;margin:auto;width:280px;height:max-content;text-align:center;display:flex;flex-direction:column;gap:8px;padding:20px;z-index:9}
button,input{font:inherit;padding:6px;border-radius:6px;border:0}
button{cursor:pointer;background:#ffd24d}
#toast{bottom:12px;left:50%;transform:translateX(-50%);display:none}
</style></head><body>
<canvas id="cv" width="1400" height="800"></canvas>
<div id="hud" class="box" style="display:none"></div>
<div id="shop" class="box" style="display:none"></div>
<div id="toast" class="box"></div>
<div id="lobby" class="box"><h2>🕵️ どろぼうマルチ</h2>
<input id="nm" placeholder="なまえ" maxlength="8"><button id="mk">ルームをつくる</button>
<input id="rc" placeholder="ルームコード（4文字）" maxlength="4"><button id="jn">コードで入る</button>
<div id="msg" style="color:#f88"></div></div>
<script>
const $=i=>document.getElementById(i),cv=$('cv'),g=cv.getContext('2d');
const HS=[{x:380,y:60,w:300,h:220,b:1},{x:800,y:60,w:340,h:220,b:1},{x:380,y:480,w:300,h:260},{x:800,y:480,w:340,h:260}];
const CAR={x:150,y:520},SHOP={x:150,y:200},NM=['🔧 ピッキング','🎒 バッグ','👟 くつ','🚗 トランク'],BASE=[60,50,40,80];
const IT=[[['🧸',20],['📻',35],['👟',30]],[['📺',80],['🎮',70],['⌚',90]],[['💻',180],['📷',150],['🎸',200]],[['💍',400],['🖼️',600],['🏺',500]]];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),door=i=>({x:HS[i].x+HS[i].w/2,y:HS[i].y+(HS[i].b?HS[i].h:0)});
const rnd=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
function mkItems(seed){const r=rnd(seed),a=[];HS.forEach((h,i)=>{for(let k=0;k<8;k++){const it=IT[i][r()*3|0];a.push({id:i+'_'+k,h:i,e:it[0],v:it[1]+(r()*10|0),x:h.x+40+(k%4)*(h.w-80)/3,y:h.y+60+(k>>2)*(h.h-120)})}});return a}
let ws,me=0,code='',S={money:0,up:[0,0,0,0],day:1,seed:-1,tc:0,tv:0,taken:[],opened:[]},items=[],bag=[],P={},pend=new Set(),pos={x:150,y:400},keys={},hold=0,prog=0,cd=0,tt=0,lastSend=0;
const cap=()=>({bag:2+2*S.up[1],spd:150+25*S.up[2],car:6+6*S.up[3]});
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
const solid=(x,y)=>HS.some((h,i)=>!S.opened.includes(i)&&x>h.x-14&&x<h.x+h.w+14&&y>h.y-14&&y<h.y+h.h+14);
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2000)}
function conn(first){
  if(ws){ws.onclose=null;ws.close()}
  $('msg').textContent='';
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>send(first);
  ws.onmessage=e=>onMsg(JSON.parse(e.data));
  ws.onclose=()=>{if(code){alert('切断されました');location.reload()}else $('msg').textContent='接続できませんでした'};
}
$('mk').onclick=()=>conn({t:'create',name:$('nm').value});
$('jn').onclick=()=>conn({t:'join',name:$('nm').value,code:$('rc').value});
function onMsg(m){
  if(m.t==='err')$('msg').textContent=m.m;
  else if(m.t==='joined'){me=m.id;code=m.code;$('lobby').style.display='none';$('hud').style.display='block';$('shop').style.display='flex'}
  else if(m.t==='st'){if(m.seed!==S.seed){items=mkItems(m.seed);pend.clear()}S=m;ui()}
  else if(m.t==='p'){const ids=new Set();m.l.forEach(([id,name,x,y,col])=>{ids.add(id);const q=P[id]||(P[id]={x,y});Object.assign(q,{name,tx:x,ty:y,col})});for(const id in P)if(!ids.has(+id))delete P[id]}
  else if(m.t==='got'){pend.delete(m.id);const it=items.find(i=>i.id===m.id);if(it)bag.push({e:it.e,v:it.v})}
  else if(m.t==='loaded'){bag.splice(0,m.n);toast(m.n?'🚗 '+m.n+'個 積み込んだ！':'トランクがいっぱい！')}
  else if(m.t==='save'){localStorage.setItem('thief_save',JSON.stringify(m.d));toast('💾 セーブしました')}
}
function ui(){
  const s=$('shop');
  if(!s.dataset.b){s.dataset.b=1;
    s.innerHTML='<b>🏪 ショップ（近くで操作）</b><button id="sell">💰 トランクを売る</button>'+NM.map((n,i)=>'<button data-k="'+i+'"></button>').join('')+'<button id="sv">💾 セーブ</button><button id="ld">📂 ロード</button><button id="nd">🌅 次の日へ</button>';
    s.onclick=e=>{const b=e.target.closest('button');if(!b)return;
      if(b.id==='sv')send({t:'save'});
      else if(b.id==='ld'){try{const d=localStorage.getItem('thief_save');if(!d)throw 0;send({t:'loadsave',d:JSON.parse(d)});toast('📂 ロードしました')}catch{toast('セーブデータがありません')}}
      else if(b.id==='nd')send({t:'newday'});
      else if(dist(pos,SHOP)>130)toast('ショップに近づいてね');
      else if(b.id==='sell')send({t:'sell'});
      else send({t:'buy',k:+b.dataset.k})}}
  s.querySelectorAll('[data-k]').forEach(b=>{const k=+b.dataset.k,l=S.up[k];b.textContent=NM[k]+' Lv'+l+(l>=5?' MAX':'　¥'+BASE[k]*2**l)});
}
onkeydown=e=>{if(e.target.tagName==='INPUT')return;keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()};
onkeyup=e=>keys[e.key.toLowerCase()]=0;
function upd(dt){
  const c=cap(),dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(dx||dy){const l=Math.hypot(dx,dy),nx=pos.x+dx/l*c.spd*dt,ny=pos.y+dy/l*c.spd*dt;
    if(!solid(nx,pos.y))pos.x=Math.max(14,Math.min(1386,nx));
    if(!solid(pos.x,ny))pos.y=Math.max(14,Math.min(786,ny))}
  cd-=dt;
  if(keys.e){
    const hi=HS.findIndex((h,i)=>!S.opened.includes(i)&&dist(pos,door(i))<70);
    if(hi>=0){const need=Math.max(.5,1.2*(hi+1)+1-.7*S.up[0]);hold+=dt;prog=hold/need;if(hold>=need){send({t:'open',h:hi});hold=prog=0}}
    else{hold=prog=0;if(dist(pos,CAR)<100&&bag.length&&cd<=0){send({t:'load',v:bag.map(b=>b.v)});cd=.5}}
  }else hold=prog=0;
  items.forEach(it=>{if(S.opened.includes(it.h)&&!S.taken.includes(it.id)&&!pend.has(it.id)&&bag.length+pend.size<c.bag&&dist(pos,it)<26){pend.add(it.id);send({t:'take',id:it.id})}});
  for(const id in P){const q=P[id];q.x+=(q.tx-q.x)*.3;q.y+=(q.ty-q.y)*.3}
  const n=performance.now();if(n-lastSend>80){lastSend=n;send({t:'pos',x:pos.x,y:pos.y})}
}
function pl(x,y,col,name){g.fillStyle=col;g.beginPath();g.arc(x,y,14,0,7);g.fill();g.strokeStyle='#000';g.lineWidth=2;g.stroke();g.fillStyle='#fff';g.font='13px sans-serif';g.fillText(name,x,y-22)}
function draw(){
  const c=cap();g.clearRect(0,0,1400,800);g.textAlign='center';
  g.fillStyle='#4a4a52';g.fillRect(30,30,240,740);g.fillStyle='#fff';g.font='14px sans-serif';g.fillText('ベース',150,52);
  g.font='46px sans-serif';g.fillText('🏪',SHOP.x,SHOP.y+16);g.fillText('🚗',CAR.x,CAR.y+16);
  g.font='14px sans-serif';g.fillText('ショップ',SHOP.x,SHOP.y+42);g.fillText('車 '+S.tc+'/'+c.car,CAR.x,CAR.y+42);
  HS.forEach((h,i)=>{const o=S.opened.includes(i),d=door(i);
    g.fillStyle=o?'#d8c9a0':'#7a4e3b';g.fillRect(h.x,h.y,h.w,h.h);g.strokeStyle='#2a1a12';g.lineWidth=6;g.strokeRect(h.x,h.y,h.w,h.h);
    g.fillStyle=o?'#d8c9a0':'#3a2418';g.fillRect(d.x-25,d.y-6,50,12);
    g.fillStyle='#fff';g.font='14px sans-serif';g.fillText((o?'':'🔒')+'🏠'+(i+1)+' '+'★'.repeat(i+1),h.x+h.w/2,h.y-12)});
  g.font='26px sans-serif';
  items.forEach(it=>{if(S.opened.includes(it.h)&&!S.taken.includes(it.id))g.fillText(it.e,it.x,it.y+9)});
  for(const id in P)if(+id!==me)pl(P[id].x,P[id].y,P[id].col,P[id].name);
  if(me){const mp=P[me];pl(pos.x,pos.y,mp?mp.col:'#fff',(mp?mp.name:'')+'（あなた）');
    if(prog>0){g.fillStyle='#000a';g.fillRect(pos.x-25,pos.y-46,50,8);g.fillStyle='#ffd24d';g.fillRect(pos.x-25,pos.y-46,50*prog,8)}
    $('hud').innerHTML='ルーム <b>'+code+'</b>（'+Object.keys(P).length+'/5人）　'+S.day+'日目<br>💰 ¥'+S.money+'　🎒 '+bag.map(b=>b.e).join('')+' '+bag.length+'/'+c.bag+'　🚗 '+S.tc+'/'+c.car+'（¥'+S.tv+'）<br><small>WASD/矢印:移動　家の前でE長押し:鍵開け　車の近くでE:積み込み</small>'}
}
let last=performance.now();
(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(me)upd(dt);draw();requestAnimationFrame(loop)})(last);
</script></body></html>
